name: CI Agent

on:
  pull_request_target:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number (PR review mode)"
        required: false
        type: number
      base_commit:
        description: "Base commit SHA (diff mode)"
        required: false
        type: string
      head_commit:
        description: "Head commit SHA (diff mode)"
        required: false
        type: string

# A labeled run is gated by GitHub's permission to apply the label (triage or above), and the token is the only limit on what the run can do: `pull-requests: write` submits the review and removes the trigger label and every selector label.
# `contents: read` is all the checkout and the base commit fetch need.
permissions:
  pull-requests: write
  contents: read

jobs:
  ci-agent:
    # GitHub is expected to emit no labeled event for a pull request opened with the label already applied, so only that pull request's opened run reviews it and the label stays on the pull request until it is removed by hand.
    if: github.event_name != 'pull_request_target' || github.event.action != 'labeled' || github.event.label.name == 'Review Start'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zoltu/ci-docker-agent:latest
      options: --user root
    steps:
      # Intentionally checks out the base branch; PR diff is fetched via GitHub API
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run CI Agent
        run: bun /ci-agent/source/index.mts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # GitHub sets this only for labeled events, so opened and manual runs leave it empty.
          TRIGGER_LABEL: ${{ github.event.label.name }}
          BASE_COMMIT: ${{ github.event.inputs.base_commit }}
          HEAD_COMMIT: ${{ github.event.inputs.head_commit }}
          AI_API_URL: ${{ vars.AI_API_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MAX_TOKENS: ${{ vars.AI_MAX_TOKENS }}

      - name: Upload debug traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-traces
          path: /debug
          retention-days: 7
