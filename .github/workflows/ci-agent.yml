name: CI Agent

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  ci-agent:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zoltu/ci-docker-agent:latest
      options: --user root --volume ${{ runner.temp }}/agent-debug:/debug
    steps:
      # Intentionally checks out the base branch; PR diff is fetched via GitHub API
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run CI Agent
        run: bun /ci-agent/source/index.mts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          EVENT_TYPE: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          AI_API_URL: ${{ secrets.AI_API_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}

      - name: Upload debug traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-traces
          path: ${{ runner.temp }}/agent-debug
          retention-days: 7
